[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lambdazap"           # repo = pip = import name
version = "0.1.2"
description = "OWASP ZAP scans of your own sites from a web UI on a Lambda Function URL; scanners are CodeBuild instances you start and shut down like machines, ≈ $0 while none is on."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frank Zhang" }]
keywords = ["serverless", "aws", "lambda", "codebuild", "zap", "owasp", "security", "dast"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["idlefree-auth", "idlefree-ui"]  # shared sign-in + console CSS (boto3 comes with the Lambda runtime)

[project.urls]
Homepage = "https://github.com/cloudformer/lambdazap"
IdleFree = "https://cloudformer.github.io/"
Repository = "https://github.com/cloudformer/lambdazap"
Deploy = "https://registry.terraform.io/modules/cloudformer/infra/aws/latest/submodules/lambdazap"
Changelog = "https://github.com/cloudformer/lambdazap/blob/main/CHANGELOG.md"
Issues = "https://github.com/cloudformer/lambdazap/issues"

[tool.setuptools]
packages = ["lambdazap", "lambdazap.server"]   # lambdazap.server = the Lambda (handler lambdazap.server.lambda_function.lambda_handler)

[tool.setuptools.package-data]
"lambdazap" = ["image/Dockerfile", "image/scan.py"]   # the scan image's build context
"lambdazap.server" = ["index.html"]                   # the web UI
