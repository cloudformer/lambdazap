<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gCompute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F58534"/><stop offset="1" stop-color="#C7511F"/>
    </linearGradient>
    <linearGradient id="gStorage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CAE3E"/><stop offset="1" stop-color="#3F8624"/>
    </linearGradient>
    <linearGradient id="gConsole" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8C4FFF"/><stop offset="1" stop-color="#5B3BC8"/>
    </linearGradient>
    <linearGradient id="gBuild" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A8BF0"/><stop offset="1" stop-color="#2C5BC8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CBD5E1"/>
    </marker>
    <style>
      .group  { fill: none; stroke: #94A3B8; stroke-width: 1.3; }
      .gtitle { font-size: 15px; font-weight: 600; fill: #CBD5E1; }
      .label  { font-size: 12.5px; font-weight: 600; fill: #F1F5F9; }
      .sub    { font-size: 11px; fill: #94A3B8; }
      .edge   { fill: none; stroke: #CBD5E1; stroke-width: 1.8; }
      .callout      { fill: #F2443B; }
      .callout-text { font-size: 12.5px; font-weight: 600; fill: #FFFFFF; }
      .step   { font-size: 11.5px; fill: #E2E8F0; }
      .glyph  { fill: none; stroke: #FFFFFF; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1100" height="560" rx="18" fill="#0F172A"/>

  <!-- ====================== your browser ====================== -->
  <rect x="30" y="56" width="250" height="420" rx="10" class="group" stroke-dasharray="6 5"/>
  <text x="155" y="84" text-anchor="middle" class="gtitle">You</text>

  <g transform="translate(112,120)">
    <rect width="86" height="86" rx="10" fill="url(#gConsole)"/>
    <rect x="13" y="16" width="60" height="8" rx="2" fill="#FFFFFF" opacity="0.95"/>
    <rect x="13" y="29" width="18" height="42" rx="3" fill="#FFFFFF" opacity="0.35"/>
    <rect x="34" y="29" width="39" height="42" rx="3" fill="#FFFFFF" opacity="0.22"/>
    <rect x="38" y="35" width="31" height="4.5" rx="2" fill="#FFFFFF"/>
    <rect x="38" y="44" width="31" height="4.5" rx="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="38" y="53" width="31" height="4.5" rx="2" fill="#FFFFFF" opacity="0.7"/>
    <text x="43" y="110" text-anchor="middle" class="label">Browser: the console</text>
    <text x="43" y="126" text-anchor="middle" class="sub">start · stop · add scan · reports</text>
  </g>
  <rect x="48" y="300" width="22" height="22" rx="4" class="callout"/><text x="59" y="316" text-anchor="middle" class="callout-text">1</text>
  <text x="78" y="310" class="step">sign in: user + password</text>
  <text x="78" y="325" class="step">(HTTP Basic) or Cloudflare</text>
  <text x="78" y="340" class="step">Access. A public URL,</text>
  <text x="78" y="355" class="step">sign-in is the only gate.</text>

  <!-- browser -> lambda -->
  <path d="M280 163 L 398 163" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="292" y="130" width="94" height="24" rx="5" class="callout"/>
  <text x="339" y="147" text-anchor="middle" class="callout-text">HTTPS</text>

  <!-- ====================== lambdazap ====================== -->
  <rect x="330" y="40" width="740" height="490" rx="12" class="group" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="352" y="70" class="gtitle" font-size="18" fill="#F8FAFC">lambdazap: OWASP ZAP scans, driven from a serverless console</text>
  <text x="352" y="88" class="sub">Lambda Function URL · CodeBuild scanners · S3 queue + reports · ≈ $0 when idle</text>

  <!-- Lambda -->
  <rect x="356" y="110" width="250" height="210" rx="9" class="group"/>
  <text x="481" y="134" text-anchor="middle" class="gtitle" font-size="13">Console (always on, idle-free)</text>
  <g transform="translate(386,158)">
    <rect width="86" height="86" rx="10" fill="url(#gCompute)"/>
    <text x="43" y="62" text-anchor="middle" font-size="50" font-weight="700" fill="#FFFFFF">λ</text>
    <text x="43" y="110" text-anchor="middle" class="label">Lambda</text>
    <text x="43" y="126" text-anchor="middle" class="sub">serves UI + API</text>
  </g>
  <g transform="translate(494,158)">
    <text x="0" y="14" class="step">starts / stops a</text>
    <text x="0" y="29" class="step">scanner (a lease</text>
    <text x="0" y="44" class="step">caps its lifetime)</text>
    <text x="0" y="72" class="step">writes a scan to</text>
    <text x="0" y="87" class="step">the S3 queue</text>
    <text x="0" y="115" class="step">reads reports back</text>
  </g>

  <!-- S3 -->
  <rect x="820" y="110" width="226" height="310" rx="9" class="group"/>
  <text x="933" y="134" text-anchor="middle" class="gtitle" font-size="13">Storage</text>
  <g transform="translate(890,158)">
    <rect width="86" height="86" rx="10" fill="url(#gStorage)"/>
    <path d="M20 22 h46 l-6 46 h-34 z" class="glyph" stroke-width="2.8"/>
    <ellipse cx="43" cy="22" rx="23" ry="6" class="glyph" stroke-width="2.4"/>
    <text x="43" y="110" text-anchor="middle" class="label">S3 bucket</text>
  </g>
  <text x="836" y="288" class="step">tasks/ · claims/</text>
  <text x="836" y="305" class="step">leases/ — the queue</text>
  <text x="836" y="330" class="step">reports/&lt;id&gt;/&lt;host&gt;/</text>
  <text x="836" y="347" class="step">report.html · json · md</text>
  <text x="836" y="372" class="sub">retention: 30 days</text>
  <text x="836" y="389" class="sub">TLS only · private</text>

  <!-- CodeBuild scanners -->
  <rect x="356" y="340" width="440" height="160" rx="9" class="group"/>
  <text x="576" y="364" text-anchor="middle" class="gtitle" font-size="13">Scanners (run only while on — this is the only cost)</text>
  <g transform="translate(386,384)">
    <rect width="86" height="86" rx="10" fill="url(#gBuild)"/>
    <path d="M30 34 l-12 12 l12 12 M56 34 l12 12 l-12 12" class="glyph" stroke-width="3"/>
    <text x="43" y="110" text-anchor="middle" class="label">CodeBuild · ZAP</text>
  </g>
  <g transform="translate(494,384)">
    <text x="0" y="14" class="step">started on demand, size you pick</text>
    <text x="0" y="31" class="step">polls S3, claims one scan (If-None-Match)</text>
    <text x="0" y="48" class="step">runs zap-baseline / full / api</text>
    <text x="0" y="65" class="step">uploads the report, then the next scan</text>
    <text x="0" y="86" class="step">self-stops on idle / lease / shutdown</text>
  </g>

  <!-- edges -->
  <!-- lambda -> codebuild (start) -->
  <path d="M429 320 L 429 380" class="edge" marker-end="url(#arrow)"/>
  <rect x="300" y="336" width="120" height="22" rx="5" class="callout"/>
  <text x="360" y="353" text-anchor="middle" class="callout-text">2  start_build</text>
  <!-- lambda -> s3 (enqueue + read reports) -->
  <path d="M606 200 L 816 200" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="648" y="176" width="126" height="22" rx="5" class="callout"/>
  <text x="711" y="193" text-anchor="middle" class="callout-text">3  queue · reports</text>
  <!-- codebuild -> s3 -->
  <path d="M796 420 L 900 420 L 900 254" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="806" y="398" width="120" height="22" rx="5" class="callout"/>
  <text x="866" y="415" text-anchor="middle" class="callout-text">4  claim · upload</text>

  <text x="700" y="518" text-anchor="middle" class="sub">Idle: no scanner running, so no compute fee — just a few objects in S3. A report is a plain file you can always take away.</text>
</svg>
